name: Catroid
options:
  bundleIdPrefix: org.catrobat
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    SWIFT_OBJC_BRIDGING_HEADER: ios-bridge/Catroid-Bridging-Header.h
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/ios-bridge
      - $(SRCROOT)/third_party/box2d/include
      - $(SRCROOT)/third_party/box2d/src
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
targets:
  Catroid:
    type: application
    platform: iOS
    sources:
      # Портированное ядро. Старые наброски ui/ и stage/ пока исключены — их заменит порт.
      - path: catroid/src/main/java
        includes:
          - "**/*.swift"
        excludes:
          - "**/ui/**"
          - "**/stage/**"
      - path: ios/App
      - path: ios-bridge
        excludes:
          - README.md
      - path: third_party/box2d/src
        includes:
          - "**/*.cpp"
          - "**/*.h"
        compilerFlags:
          - -w
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Catroid
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Camera is used by bricks that need it.
        NSMicrophoneUsageDescription: Microphone is used by sound and loudness sensors.
        NSMotionUsageDescription: Motion sensors are used by the accelerometer and inclination formulas.
        NSSpeechRecognitionUsageDescription: Speech recognition is used by listening bricks.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.catrobat.catroid.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
